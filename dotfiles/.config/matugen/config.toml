[config]
version_check = false

[templates.m3colors]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/state/quickshell/user/generated/colors.json'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland/colors.lua'
output_path = '~/.config/hypr/hyprland/colors.lua'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprland/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock/colors.conf'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel/fuzzel_theme.ini'
output_path = '~/.config/fuzzel/fuzzel_theme.ini'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.kde_colors]
input_path = '~/.config/matugen/templates/kde/color.txt'
output_path = '~/.local/state/quickshell/user/generated/color.txt'

[templates.wallpaper]
input_path = '~/.config/matugen/templates/wallpaper.txt'
output_path = '~/.local/state/quickshell/user/generated/wallpaper/path.txt'

# Zen Browser (zen-wabi bridge). Renders chrome/content CSS + the 8-color
# JSON watched by matugen-bridge.uc.js. Profile dir is fixed to "default".
[templates.zen_userchrome]
input_path = '~/.config/matugen/templates/zen/userChrome.css'
output_path = '~/.config/zen/default/chrome/userChrome.css'

[templates.zen_usercontent]
input_path = '~/.config/matugen/templates/zen/userContent.css'
output_path = '~/.config/zen/default/chrome/userContent.css'

[templates.zen_userstyles]
input_path = '~/.config/matugen/templates/zen/userContent.css'
output_path = '~/.config/zen/default/chrome/matugen-userstyles.css'

[templates.zen_userstyles_github]
input_path = '~/.config/matugen/templates/zen/userContent.github.css'
output_path = '~/.config/zen/default/chrome/matugen-userstyles-github.css'

[templates.zen_userstyles_youtube]
input_path = '~/.config/matugen/templates/zen/userContent.youtube.css'
output_path = '~/.config/zen/default/chrome/matugen-userstyles-youtube.css'

[templates.zen_vars]
input_path = '~/.config/matugen/templates/zen/matugen-vars.json'
output_path = '~/.config/zen/default/chrome/matugen-vars.json'
